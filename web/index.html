<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lagman House Menu</title>
  <link rel="icon" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <img src="./logo.png" alt="Lagman House" class="logo" />
    <div>
      <h1 id="restaurantName">Lagman House</h1>
    </div>
    <button id="langBtn" class="ghost" type="button">اردو</button>
  </header>

  <main>
    <button id="trackPill" class="trackpill hidden" type="button"></button>
    <section id="status" class="status hidden"></section>
    <nav id="categories" class="chips"></nav>
    <section id="menu" class="grid"></section>
    <p id="empty" class="muted hidden" data-i18n="empty">The menu is not available right now.</p>
  </main>

  <footer id="cartBar" class="cartbar hidden">
    <div>
      <strong id="cartCount">0</strong> <span data-i18n="items">items</span>
      <div id="cartTotal" class="total"></div>
    </div>
    <button id="reviewBtn" class="primary" type="button" data-i18n="review">Review order</button>
  </footer>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 data-i18n="yourOrder">Your order</h2>
        <button id="closeSheet" class="ghost" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="cartLines"></div>
      <label class="field">
        <span data-i18n="tableField">Table number (optional)</span>
        <input id="tableInput" maxlength="12" inputmode="text" autocomplete="off" />
      </label>
      <label class="field">
        <span data-i18n="name">Your name (optional)</span>
        <input id="customerName" maxlength="40" />
      </label>
      <label class="field">
        <span data-i18n="note">Note for the kitchen (optional)</span>
        <input id="note" maxlength="120" />
      </label>
      <div class="sheet-total"><span data-i18n="total">Total</span><strong id="sheetTotal"></strong></div>
      <div id="sheetSavings" class="muted small"></div>
      <button id="submitBtn" class="primary wide" type="button" data-i18n="send">Send to cashier</button>
      <p class="muted small" data-i18n="disclaimer">A cashier will confirm your order and take payment at the counter.</p>
    </div>
  </div>

  <div id="dealSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="dealTitle"></h2>
        <button id="closeDeal" class="ghost" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="dealBody"></div>
      <button id="dealAdd" class="primary wide" type="button"></button>
    </div>
  </div>

  <div id="itemSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-inner">
      <div class="sheet-head">
        <span></span>
        <button id="closeItem" class="ghost" type="button" aria-label="Close">&times;</button>
      </div>
      <div id="itemBody" class="item-detail"></div>
      <button id="itemAdd" class="primary wide" type="button"></button>
    </div>
  </div>

  <div id="tracker" class="tracker hidden" data-status="pending">
    <div class="tracker-inner">
      <p class="muted small" data-i18n="orderNo">Your order number</p>
      <div id="ticketNo" class="ticket"></div>
      <p class="muted small" data-i18n="showStaff">Show this number at the counter if asked.</p>
      <h2 id="trackTitle"></h2>
      <p id="trackBody" class="muted"></p>
      <div id="trackTimer" class="timer"></div>
      <p id="trackReason" class="reason"></p>
      <div id="trackReceipt" class="receipt hidden"></div>
      <button id="againBtn" class="ghost wide" type="button" data-i18n="again">Start a new order</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
